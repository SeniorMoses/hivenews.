<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Hivenews Dashboard</title>

<style>

:root{

--primary:#2563eb;
--danger:#dc2626;
--success:#16a34a;

}

[data-theme="dark"]{

--bg:#081529;
--card:#10233d;
--border:#1f3b63;
--text:#ffffff;
--muted:#9ca3af;

}

[data-theme="light"]{

--bg:#f5f7fb;
--card:#ffffff;
--border:#dbe3ef;
--text:#111827;
--muted:#6b7280;

}

*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;

}

body{

background:var(--bg);
color:var(--text);
min-height:100vh;

}

header{

display:flex;
justify-content:space-between;
align-items:center;

padding:18px;

background:var(--card);

border-bottom:1px solid var(--border);

position:sticky;

top:0;

z-index:100;

}

.logo{

font-size:24px;

font-weight:bold;

color:var(--primary);

}

.right{

display:flex;

gap:10px;

align-items:center;

}

button{

cursor:pointer;

border:none;

border-radius:8px;

padding:10px 18px;

transition:.2s;

}

.btn{

background:var(--primary);

color:white;

}

.btn:hover{

opacity:.9;

}

.btn-danger{

background:var(--danger);

color:white;

}

.btn-outline{

background:transparent;

border:1px solid var(--border);

color:var(--text);

}

.container{

max-width:1100px;

margin:auto;

padding:25px;

}

.search{

display:flex;

gap:10px;

margin-bottom:20px;

}

.search input{

flex:1;

padding:12px;

border-radius:8px;

border:1px solid var(--border);

background:var(--card);

color:var(--text);

}

.admin-panel{

background:var(--card);

padding:20px;

border-radius:12px;

margin-bottom:25px;

display:none;

}

.admin-panel h2{

margin-bottom:15px;

}

.admin-panel input,

.admin-panel textarea{

width:100%;

padding:12px;

margin-bottom:12px;

background:var(--bg);

color:var(--text);

border:1px solid var(--border);

border-radius:8px;

}

.news-feed{

display:grid;

grid-template-columns:1fr;

gap:20px;

}

.news-card{

background:var(--card);

padding:20px;

border-radius:12px;

border:1px solid var(--border);

}

.news-card h3{

margin-bottom:10px;

}

.news-card small{

color:var(--muted);

}

.news-actions{

display:flex;

gap:10px;

margin-top:15px;

flex-wrap:wrap;

}

.comment-section{

margin-top:15px;

display:none;

}

.comment-box{

padding:10px;

margin:8px 0;

background:var(--bg);

border-left:3px solid var(--primary);

}

.comment-input{

display:flex;

gap:8px;

margin-top:10px;

}

.comment-input input{

flex:1;

padding:10px;

background:var(--bg);

color:var(--text);

border:1px solid var(--border);

border-radius:8px;

}

.pagination{

display:flex;

justify-content:center;

gap:10px;

margin:30px 0;

flex-wrap:wrap;

}

.toast{

position:fixed;

right:20px;

bottom:20px;

background:var(--success);

color:white;

padding:12px 20px;

border-radius:8px;

display:none;

}

@media(max-width:700px){

header{

flex-direction:column;

gap:15px;

}

.search{

flex-direction:column;

}

}

</style>

</head>

<body>

<header>

<div class="logo">
📰 Hivenews
</div>

<div class="right">

<button
class="btn-outline"
id="themeBtn">
🌙
</button>

<span id="welcome"></span>

<button
class="btn"
onclick="logout()">
Logout
</button>

</div>

</header>

<div class="container">

<div class="search">

<input
id="searchInput"
placeholder="Search news...">

<button
class="btn"
onclick="searchNews()">
Search
</button>

<button
class="btn-outline"
onclick="loadNews()">
Reset
</button>

</div>

<div
id="adminPanel"
class="admin-panel">

<h2>Publish News</h2>

<input
type="date"
id="newsDate">

<input
placeholder="Title"
id="newsTitle">

<textarea
rows="5"
id="newsContent"
placeholder="Content">
</textarea>

<div
style="display:flex;gap:10px">

<button
class="btn"
onclick="postNews()">

Publish

</button>

<button
class="btn-outline"
onclick="clearDraft()">

Clear Draft

</button>

</div>

</div>

<div
id="newsFeed"
class="news-feed">

</div>

<div
id="pagination"
class="pagination">

</div>

</div>

<div
id="toast"
class="toast">

Saved

</div>

<script>

const API_URL="https://hivenews-v2.onrender.com";

let accessToken=
localStorage.getItem("access_token")||"";

let role=
localStorage.getItem("user_role")||"";

let currentPage=1;

let bookmarks=
JSON.parse(localStorage.getItem("bookmarks")||"[]");

let likes=
JSON.parse(localStorage.getItem("likes")||"{}");

let history=
JSON.parse(localStorage.getItem("history")||"[]");

const toast=document.getElementById("toast");

function showToast(msg){

toast.innerText=msg;

toast.style.display="block";

setTimeout(()=>{

toast.style.display="none";

},2500);

}

function logout(){

localStorage.clear();

location.href="index.html";

}

async function api(url,options={}){

options.headers={

...options.headers,

Authorization:`Bearer ${accessToken}`

};

const res=await fetch(url,options);

if(res.status===401){

logout();

}

return res;

}

function toggleTheme(){

const html=document.documentElement;

const theme=

html.dataset.theme==="dark"

?"light"

:"dark";

html.dataset.theme=theme;

localStorage.setItem("theme",theme);

document.getElementById("themeBtn").innerText=

theme==="dark"

?"🌙"

:"☀️";

}

document
.getElementById("themeBtn")
.onclick=toggleTheme;

window.onload=()=>{

const saved=

localStorage.getItem("theme");

if(saved){

document.documentElement.dataset.theme=saved;

}

document.getElementById("themeBtn").innerText =
        saved === "dark" ? "🌙" : "☀️";
    }

    if (!accessToken) {
        location.href = "index.html";
        return;
    }

    document.getElementById("welcome").textContent =
        "Hi, " + role;

    if (role === "admin") {

        document.getElementById("adminPanel")
            .style.display = "block";

        loadDraft();
    }

    loadNews();

};

/* ===========================
   SECTION 1
   LOAD NEWS
=========================== */

async function loadNews(page = 1){

    currentPage = page;

    localStorage.setItem(
        "current_page",
        page
    );

    const feed =
        document.getElementById("newsFeed");

    feed.innerHTML =
        "<p>Loading news...</p>";

    const res =
        await api(
            `${API_URL}/read?page=${page}&limit=6`
        );

    if(!res.ok){

        feed.innerHTML =
            "<p>Unable to load news.</p>";

        return;
    }

    const data =
        await res.json();

    renderNews(data.data);

    renderPagination(
        data.current_page,
        data.total_pages
    );

}

/* ===========================
   SECTION 2
   RENDER NEWS
=========================== */

function renderNews(posts){

    const feed =
        document.getElementById(
            "newsFeed"
        );

    feed.innerHTML = "";

    if(posts.length===0){

        feed.innerHTML =
            "<h3>No News Found</h3>";

        return;
    }

    posts.forEach(post=>{

        const likeCount =
            likes[post.id] || 0;

        const saved =
            bookmarks.includes(post.id);

        const card =
        document.createElement("div");

        card.className =
            "news-card";

        card.innerHTML = `

<h3>${post.title}</h3>

<small>${post.date}</small>

<p style="margin-top:15px;">
${post.content}
</p>

<div class="news-actions">

<button
class="btn-outline"
onclick="toggleLike(${post.id})">

❤️
<span id="like-${post.id}">
${likeCount}
</span>

</button>

<button
class="btn-outline"
onclick="toggleBookmark(${post.id})">

${saved ? "★ Saved" : "☆ Save"}

</button>

<button
class="btn-outline"
onclick="toggleComments(${post.id})">

Comments

</button>

${
role==="admin"
?

`<button
class="btn-danger"
onclick="deleteNews(${post.id})">

Delete

</button>`

:

""

}

</div>

<div
id="comments-${post.id}"
class="comment-section">

<div
id="comment-list-${post.id}">

Loading...

</div>

<div class="comment-input">

<input
id="comment-input-${post.id}"
placeholder="Write comment...">

<button
class="btn"
onclick="postComment(${post.id})">

Send

</button>

</div>

</div>

`;

        feed.appendChild(card);

    });

}

/* ===========================
   SECTION 3
   PAGINATION
=========================== */

function renderPagination(
current,
total
){

const box =
document.getElementById(
"pagination"
);

box.innerHTML="";

for(
let i=1;
i<=total;
i++
){

const btn =
document.createElement(
"button"
);

btn.textContent=i;

btn.className =
i===current
?
"btn"
:
"btn-outline";

btn.onclick=()=>{

loadNews(i);

};

box.appendChild(btn);

}

}

/* ===========================
   SECTION 4
   SEARCH
=========================== */

async function searchNews(){

const query=
document
.getElementById(
"searchInput"
)
.value
.trim();

if(!query){

loadNews();

return;

}

localStorage.setItem(
"last_search",
query
);

const res=
await api(
`${API_URL}/posts/${encodeURIComponent(query)}`
);

if(!res.ok){

showToast(
"No results"
);

return;

}

const posts=
await res.json();

renderNews(posts);

document
.getElementById(
"pagination"
)
.innerHTML="";

}

/* ===========================
   SECTION 5
   LIKES
=========================== */

function toggleLike(id){

likes[id]=
(likes[id]||0)+1;

localStorage.setItem(
"likes",
JSON.stringify(likes)
);

document.getElementById(
`like-${id}`
).textContent=
likes[id];

showToast(
"Liked"
);

}

/* ===========================
   SECTION 6
   BOOKMARKS
=========================== */

function toggleBookmark(id){

const index=
bookmarks.indexOf(id);

if(index>-1){

bookmarks.splice(
index,
1
);

showToast(
"Removed"
);

}else{

bookmarks.push(id);

showToast(
"Saved"
);

}

localStorage.setItem(

"bookmarks",

JSON.stringify(bookmarks)

);

loadNews(currentPage);

    }
/* ===========================
   SECTION 7
   TOGGLE COMMENTS
=========================== */

async function toggleComments(newsId){

    const section =
        document.getElementById(
            `comments-${newsId}`
        );

    if(section.style.display==="block"){

        section.style.display="none";
        return;

    }

    section.style.display="block";

    await loadComments(newsId);

}

/* ===========================
   SECTION 8
   LOAD COMMENTS
=========================== */

async function loadComments(newsId){

    const container =
        document.getElementById(
            `comment-list-${newsId}`
        );

    container.innerHTML =
        "<p>Loading comments...</p>";

    const res =
        await api(
            `${API_URL}/read_comment/${newsId}`
        );

    if(!res.ok){

        container.innerHTML =
            "<p>No comments.</p>";

        return;

    }

    const comments =
        await res.json();

    if(comments.length===0){

        container.innerHTML =
            "<p>No comments yet.</p>";

        return;

    }

    container.innerHTML="";

    comments.forEach(comment=>{

        const div =
            document.createElement("div");

        div.className="comment-box";

        div.innerHTML=`
            <strong>User</strong><br>
            ${comment.comment}
        `;

        container.appendChild(div);

    });

}

/* ===========================
   SECTION 9
   POST COMMENT
=========================== */

async function postComment(newsId){

    const input =
        document.getElementById(
            `comment-input-${newsId}`
        );

    const text =
        input.value.trim();

    if(!text){

        showToast("Enter a comment");

        return;

    }

    const res =
        await api(
            `${API_URL}/comments/`,
            {

                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({

                    news_id:newsId,

                    comment:text

                })

            }
        );

    if(!res.ok){

        showToast(
            "Failed"
        );

        return;

    }

    input.value="";

    showToast(
        "Comment added"
    );

    loadComments(newsId);

}

/* ===========================
   SECTION 10
   POST NEWS
=========================== */

async function postNews(){

    const date =
        document
        .getElementById(
            "newsDate"
        ).value;

    const title =
        document
        .getElementById(
            "newsTitle"
        ).value.trim();

    const content =
        document
        .getElementById(
            "newsContent"
        ).value.trim();

    if(!date || !title || !content){

        showToast(
            "Complete every field"
        );

        return;

    }

    const res =
        await api(
            `${API_URL}/post`,
            {

                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({

                    date:date,

                    title:title,

                    content:content

                })

            }
        );

    if(!res.ok){

        showToast(
            "Unable to publish"
        );

        return;

    }

    showToast(
        "News published"
    );

    document.getElementById(
        "newsTitle"
    ).value="";

    document.getElementById(
        "newsContent"
    ).value="";

    localStorage.removeItem(
        "draft"
    );

    loadNews();

}

/* ===========================
   SECTION 11
   DELETE NEWS
=========================== */

async function deleteNews(id){

    if(
        !confirm(
            "Delete this article?"
        )
    ){

        return;

    }

    const res =
        await api(

            `${API_URL}/delete_news/${id}`,

            {

                method:"DELETE"

            }

        );

    if(!res.ok){

        showToast(
            "Delete failed"
        );

        return;

    }

    showToast(
        "Deleted"
    );

    loadNews(currentPage);

}

/* ===========================
   SECTION 12
   UPDATE NEWS
=========================== */

async function updateNews(

    id,

    oldTitle,

    oldContent

){

    const title =
        prompt(
            "New title",
            oldTitle
        );

    if(title===null) return;

    const content =
        prompt(
            "New content",
            oldContent
        );

    if(content===null) return;

    const res =
        await api(

            `${API_URL}/update_news/`,

            {

                method:"PUT",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({

                    news_id:id,

                    new_title:title,

                    new_content:content

                })

            }

        );

    if(!res.ok){

        showToast(
            "Update failed"
        );

        return;

    }

    showToast(
        "Updated"
    );

    loadNews(currentPage);

    }
/* ===========================
   SECTION 13
   DRAFT AUTO SAVE
=========================== */

const titleInput =
document.getElementById("newsTitle");

const contentInput =
document.getElementById("newsContent");

const dateInput =
document.getElementById("newsDate");

function saveDraft(){

    if(role!=="admin") return;

    const draft={

        date:dateInput.value,

        title:titleInput.value,

        content:contentInput.value

    };

    localStorage.setItem(
        "draft",
        JSON.stringify(draft)
    );

}

function loadDraft(){

    const draft=
    JSON.parse(
        localStorage.getItem("draft")
        ||"null"
    );

    if(!draft) return;

    dateInput.value=
    draft.date||"";

    titleInput.value=
    draft.title||"";

    contentInput.value=
    draft.content||"";

}

function clearDraft(){

    localStorage.removeItem("draft");

    dateInput.value="";

    titleInput.value="";

    contentInput.value="";

    showToast("Draft cleared");

}

if(role==="admin"){

titleInput.addEventListener(
"input",
saveDraft
);

contentInput.addEventListener(
"input",
saveDraft
);

dateInput.addEventListener(
"change",
saveDraft
);

}

/* ===========================
   SECTION 14
   READING HISTORY
=========================== */

function addHistory(post){

let history=

JSON.parse(
localStorage.getItem("history")
||"[]"
);

history=history.filter(
item=>item.id!==post.id
);

history.unshift({

id:post.id,

title:post.title,

date:new Date().toLocaleString()

});

if(history.length>20){

history.pop();

}

localStorage.setItem(

"history",

JSON.stringify(history)

);

}

/* ===========================
   SECTION 15
   RECENT SEARCHES
=========================== */

function saveSearch(query){

let searches=

JSON.parse(
localStorage.getItem(
"recent_searches"
)
||"[]"
);

searches=searches.filter(
s=>s!==query
);

searches.unshift(query);

if(searches.length>10){

searches.pop();

}

localStorage.setItem(

"recent_searches",

JSON.stringify(searches)

);

}

/* ===========================
   SECTION 16
   VIEW HISTORY
=========================== */

function showHistory(){

const history=

JSON.parse(
localStorage.getItem(
"history"
)
||"[]"
);

if(history.length===0){

alert(
"No reading history."
);

return;

}

let text="Reading History\n\n";

history.forEach(item=>{

text+=

item.title+

"\n"+

item.date+

"\n\n";

});

alert(text);

}

/* ===========================
   SECTION 17
   VIEW BOOKMARKS
=========================== */

function showBookmarks(){

if(bookmarks.length===0){

showToast(
"No bookmarks"
);

return;

}

let text="Bookmarked IDs\n\n";

bookmarks.forEach(id=>{

text+=id+"\n";

});

alert(text);

}

/* ===========================
   SECTION 18
   RESTORE PAGE
=========================== */

const lastPage=

Number(

localStorage.getItem(
"current_page"
)

||1

);

currentPage=lastPage;

/* ===========================
   SECTION 19
   RESTORE SEARCH
=========================== */

const lastSearch=

localStorage.getItem(
"last_search"
);

if(lastSearch){

document.getElementById(
"searchInput"
).value=lastSearch;

}

/* ===========================
   SECTION 20
   GLOBAL SHORTCUTS
=========================== */

document.addEventListener(

"keydown",

function(e){

if(

e.key==="Enter"

&&

document.activeElement===

document.getElementById(
"searchInput"
)

){

searchNews();

}

}

);

/* ===========================
   SECTION 21
   BEFORE UNLOAD
=========================== */

window.addEventListener(

"beforeunload",

function(){

if(role==="admin"){

saveDraft();

}

}

);

/* ===========================
   SECTION 22
   INITIALIZATION
=========================== */

loadNews(currentPage);

showToast("Welcome to Hivenews");

</script>

</body>

</html>
